<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Folios editoriales animados en los márgenes">
<style>
.folio{fill:none;stroke:#142B45;stroke-width:1.5;opacity:.20;animation:float 8s ease-in-out infinite alternate}.f2{animation-delay:-2s}.f3{animation-delay:-4s}.f4{animation-delay:-6s}.rule{stroke:#142B45;stroke-width:1;opacity:.12}.accent{fill:none;stroke:#C78355;stroke-width:4;stroke-linecap:square;stroke-dasharray:48 500;animation:travel 7s linear infinite}.dot{fill:#C78355;animation:breathe 4s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(-8px)}to{transform:translateY(8px)}}@keyframes travel{from{stroke-dashoffset:0}to{stroke-dashoffset:-548}}@keyframes breathe{from{opacity:.35}to{opacity:.9}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
